# main에 올리면 웹 버전을 빌드해 GitHub Pages에 배포한다.
name: 웹 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Pages 주소가 https://<계정>.github.io/<저장소>/ 라서 기준 경로를 저장소 이름으로 맞춘다.
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
